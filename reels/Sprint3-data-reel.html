<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inferential Insights from Healthcare Data – sprint overview reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F1F1; --surface:#FFFFFF; --text:#000F46; --muted:#616161; --line:#D6D6D6;
  --accent:#000F46; --accentText:#FFFFFF; --chip:#E4E4E4;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000B34; --surface:#000F46; --text:#FFFFFF; --muted:#BFC3D1; --line:#404B74;
    --accent:#46C8F0; --accentText:#000B34; --chip:#404B74; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000B34; --surface:#000F46; --text:#FFFFFF; --muted:#BFC3D1; --line:#404B74;
  --accent:#46C8F0; --accentText:#000B34; --chip:#404B74; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Fira Sans","Helvetica Neue",Arial,sans-serif;}
.app{display:flex;flex-direction:column;align-items:center;padding:8px 8px 12px;gap:10px}
.top{width:100%;max-width:1600px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.top h1{font-size:1.15rem;font-weight:600;margin:0}
.top p{margin:0;color:var(--muted);font-size:.9rem}
.viewport{width:100%;display:flex;justify-content:center}
.frameWrap{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 10px 40px rgba(0,15,70,.18);background:#000F46}
#frame{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#FFFFFF}
#scene{display:block}
#scene text{font-family:"Fira Sans","Helvetica Neue",Arial,sans-serif}
#scene .mono{font-family:"Fira Mono",Menlo,Consolas,monospace}
#scene .scene{visibility:hidden}
#caption{position:absolute;left:0;right:0;bottom:44px;display:flex;justify-content:center;pointer-events:none}
#caption span{max-width:1500px;background:rgba(0,11,52,.86);color:#FFFFFF;font-size:38px;line-height:1.3;
  padding:14px 30px;border-radius:14px;text-align:center;opacity:0;transition:opacity .25s}
#caption.on span.has{opacity:1}
#bigPlay[hidden]{display:none}
#bigPlay{position:absolute;inset:0;border:0;background:rgba(0,11,52,.55);color:#FFFFFF;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;font:inherit}
#bigPlay .disc{width:190px;height:190px;border-radius:50%;background:#46C8F0;display:grid;place-items:center}
#bigPlay .disc svg{width:80px;height:80px;margin-left:12px}
#bigPlay .t{font-size:60px;font-weight:700}
#bigPlay .s{font-size:32px;color:#A3E4F7}
#bigPlay:focus-visible{outline:6px solid #FFD629;outline-offset:-6px}
.controls{display:flex;align-items:center;gap:10px;max-width:100%}
.controls button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
  color:var(--text);display:grid;place-items:center;cursor:pointer;flex:none}
.controls button.primary{background:var(--accent);color:var(--accentText);border-color:var(--accent)}
.controls button.cc{width:auto;border-radius:20px;padding:0 12px;font-weight:600;font-size:.85rem}
.controls button.cc[aria-pressed="false"]{opacity:.55}
.controls button:focus-visible,.chip:focus-visible,#scrub:focus-visible{outline:3px solid #46C8F0;outline-offset:2px}
.controls svg{width:18px;height:18px}
#scrub{flex:1;min-width:80px;accent-color:var(--accent)}
#time{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted);min-width:86px;text-align:right}
.chapters{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:1600px}
.chip{border:0;background:var(--chip);color:var(--text);border-radius:16px;padding:5px 12px;font:inherit;font-size:.8rem;cursor:pointer}
.chip.active{background:var(--accent);color:var(--accentText)}
.script{width:100%;max-width:1100px;font-size:.9rem;color:var(--muted)}
.script summary{cursor:pointer;color:var(--text);font-weight:600}
.script ol{max-height:28vh;overflow:auto;margin:8px 0 0;padding-left:1.4em;line-height:1.5}
@media (max-width:640px){.chapters{display:none}.top p{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="viewport" id="viewport">
    <div class="frameWrap" id="wrap">
      <div id="frame">
        <svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"></svg>
        <div id="caption" class="on"><span></span></div>
        <button id="bigPlay" aria-label="Play animation">
          <span class="disc"><svg viewBox="0 0 24 24" fill="#000F46"><path d="M6 3l15 9-15 9z"/></svg></span>
          <span class="t">Inferential Insights from Healthcare Data</span>
        </button>
      </div>
    </div>
  </div>
  <div class="controls" id="controls">
    <button id="playBtn" class="primary" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3l15 9-15 9z"/></svg></button>
    <button id="restartBtn" aria-label="Restart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg></button>
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Timeline">
    <span id="time">0:00 / 0:00</span>
    <button id="voiceBtn" class="cc" aria-pressed="true" aria-label="Toggle voiceover">Voice</button>
    <button id="ccBtn" class="cc" aria-pressed="true" aria-label="Toggle voiceover captions">CC</button>
  </div>
  <div class="chapters" id="chapters"></div>
  <details class="script"><summary>Voiceover script</summary><ol id="scriptList"></ol></details>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/DrawSVGPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/MorphSVGPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/MotionPathPlugin.min.js"></script>
<script>
gsap.registerPlugin(DrawSVGPlugin, MorphSVGPlugin, MotionPathPlugin);

/* ---------- University of Melbourne palette ---------- */
const C={navy:'#000F46',navyD:'#000B34',navy75:'#404B74',navy50:'#8087A2',navy25:'#BFC3D1',
sky:'#46C8F0',sky75:'#74D6F4',sky50:'#A3E4F7',sky25:'#D1F1FB',teal:'#003C55',teal75:'#406D80',teal25:'#BFCED5',
sage:'#ABC1A7',sage50:'#D5E0D3',sage25:'#EAEFE9',sageD:'#444A40',sageD25:'#D0D2CF',
grey:'#C8C8C8',grey75:'#D6D6D6',grey50:'#E4E4E4',grey25:'#F1F1F1',dgrey:'#2D2D2D',dgrey75:'#616161',dgrey50:'#969696',
pink:'#EB7BBE',pink50:'#F5BDDF',pink25:'#FADEEF',maroon:'#73234B',red:'#FF2D3C',red25:'#FFCACE',
yellow:'#FFD629',yellow50:'#FFEA94',brown:'#A84500',brown75:'#BE7440',brown50:'#D4A280',brown25:'#E9D1BF',
green:'#9FB825',green50:'#CFDC92',green25:'#E7EDC8',greenD:'#2C421D',white:'#FFFFFF'};
const SKIN=[C.brown25,C.brown50,C.brown75];
const W='#FFFFFF';
const svg=document.getElementById('scene');

/* ---------- helpers ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const idA=id=>id?`id="${id}"`:'';
function tag(x,y,text,o={}){
  const {fill=C.navy,color=W,size=34,id=''}=o;
  const w=Math.round(text.length*size*0.54+60), h=size+30;
  return `<g ${idA(id)} class="tag" transform="translate(${x} ${y})"><rect width="${w}" height="${h}" rx="${h/2}" fill="${fill}"/><text x="30" y="${(h/2+size*0.35).toFixed(1)}" font-size="${size}" font-weight="600" fill="${color}">${text}</text></g>`;
}
/* new brand icons, drawn in a 1200 x 1200 box centred on 600,600 */
const star=(cx,cy,r)=>{const a=r*.1,b=r*.45;return `M${cx} ${cy-r} C${cx+a} ${cy-b} ${cx+b} ${cy-a} ${cx+r} ${cy} C${cx+b} ${cy+a} ${cx+a} ${cy+b} ${cx} ${cy+r} C${cx-a} ${cy+b} ${cx-b} ${cy+a} ${cx-r} ${cy} C${cx-b} ${cy-a} ${cx-a} ${cy-b} ${cx} ${cy-r}Z`;};
function chipIcon(frame,core,spark){
  return `<path class="d" d="M437 63 V210 M600 63 V210 M762 63 V210 M437 990 V1137 M600 990 V1137 M762 990 V1137 M63 437 H210 M63 600 H210 M63 762 H210 M990 437 H1137 M990 600 H1137 M990 762 H1137" stroke="${frame}" stroke-width="66" stroke-linecap="round" fill="none"/>
  <rect class="d" x="210" y="210" width="780" height="780" rx="155" fill="none" stroke="${frame}" stroke-width="66"/>
  <rect class="n" x="304" y="304" width="591" height="591" rx="60" fill="${core}"/>
  <path class="n" d="${star(528,670,149)}" fill="${spark}"/><path class="n" d="${star(698,494,111)}" fill="${spark}"/>`;
}
function shieldIcon(body,rim,cross,crossFill){
  return `<path class="d f" d="M600 132 C470 215 213 248 213 248 L238 548 C255 760 360 915 495 1000 L600 1067 L705 1000 C840 915 945 760 962 548 L987 248 C987 248 730 215 600 132Z" fill="${body}" stroke="${body}" stroke-width="20" stroke-linejoin="round"/>
  <path class="d" d="M600 211 C480 290 277 307 277 307 L298 560 C315 745 405 870 515 942 L600 997 L685 942 C795 870 885 745 902 560 L922 307 C922 307 720 290 600 211Z" fill="none" stroke="${rim}" stroke-width="26" stroke-linejoin="round"/>
  <path class="d f" d="M543 399 H655 V511 H767 V623 H655 V734 H543 V623 H432 V511 H543 Z" fill="${crossFill}" stroke="${cross}" stroke-width="26" stroke-linejoin="round"/>`;
}
function aiBadge(x,y,s=1,id='',cls=''){
  return `<g ${idA(id)} class="ai-badge ${cls}" transform="translate(${x} ${y})"><g class="inner" transform="scale(${s})"><rect x="-40" y="-40" width="80" height="80" rx="18" fill="#FFFFFF"/><g transform="scale(.06) translate(-600 -600)">${chipIcon(C.navy,C.sky,C.navy)}</g></g></g>`;
}
/* bust figure: origin at bottom centre */
function person(o={}){
  const {x=0,y=0,s=1,skin=SKIN[0],shirt=C.sky,hair=C.dgrey,coat=false,id='',style='short',gesture=0}=o;
  const body=coat?W:shirt;
  const st=coat?`stroke="${C.navy25}" stroke-width="5"`:'';
  let back='',front='';
  if(style==='long'){back=`<path d="M-60 -250 C-66 -324 66 -324 60 -250 L66 -176 C30 -164 -30 -164 -66 -176 Z" fill="${hair}"/>`;front=`<path d="M-55 -252 C-57 -314 57 -316 55 -252 C44 -286 -10 -298 -55 -252Z" fill="${hair}"/>`;}
  else if(style==='bun'){back=`<circle cx="0" cy="-314" r="27" fill="${hair}"/>`;front=`<path d="M-55 -250 C-59 -314 59 -314 55 -250 C36 -284 -36 -284 -55 -250Z" fill="${hair}"/>`;}
  else {front=`<path d="M-56 -246 C-63 -320 63 -320 56 -246 C52 -272 40 -286 20 -288 C-10 -272 -40 -274 -56 -246Z" fill="${hair}"/>`;}
  const g=gesture;
  const arm=g?`<g class="arm"><path d="M${g*62} -92 L${g*132} -150" stroke="${body}" stroke-width="36" stroke-linecap="round" fill="none"/><circle cx="${g*140}" cy="-158" r="21" fill="${skin}"/></g>`:'';
  return `<g ${idA(id)} class="person" transform="translate(${x} ${y}) scale(${s})">
    <path d="M-118 0 C-118 -108 -86 -172 0 -172 C86 -172 118 -108 118 0 Z" fill="${body}" ${st}/>
    ${coat?`<path d="M-34 -168 L0 -104 L34 -168 Z" fill="${shirt}"/><path d="M-36 -168 L-6 -40 M36 -168 L6 -40" stroke="${C.navy25}" stroke-width="5" fill="none"/><path d="M-52 -158 C-66 -92 -24 -64 -8 -88" stroke="${C.navy}" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="-8" cy="-90" r="10" fill="${C.navy}"/><rect x="42" y="-122" width="40" height="9" rx="4" fill="${C.sky}"/>`:''}
    <rect x="-18" y="-204" width="36" height="40" rx="12" fill="${skin}"/>
    <g class="head">${back}<circle cx="0" cy="-250" r="52" fill="${skin}"/><ellipse cx="-52" cy="-246" rx="9" ry="13" fill="${skin}"/><ellipse cx="52" cy="-246" rx="9" ry="13" fill="${skin}"/>${front}</g>
    ${arm}
  </g>`;
}
const HEART='M0 110 C-60 60 -150 10 -150 -60 C-150 -120 -100 -150 -60 -150 C-30 -150 -10 -134 0 -112 C10 -134 30 -150 60 -150 C100 -150 150 -120 150 -60 C150 10 60 60 0 110 Z';
const SPARK='M0 -16 L4 -4 L16 0 L4 4 L0 16 L-4 4 L-16 0 L-4 -4Z';
function fadeIn(tl,sel,d=.7){tl.fromTo(sel,{autoAlpha:0},{autoAlpha:1,duration:d,ease:'power1.inOut'},0);}
function popTag(tl,sel,t){tl.from(sel,{scale:.5,opacity:0,transformOrigin:'0% 50%',duration:.6,ease:'back.out(2)'},t);}
/* typing reveal via an animated clip rect: scrub-safe, steps one character at a time */
let clipN=0;
function typeText(tl,sel,str,dur,at,mono=false){
  const el=document.querySelector(sel); el.textContent=str;
  const size=+el.getAttribute('font-size'), x=+el.getAttribute('x'), y=+el.getAttribute('y');
  const w=str.length*size*(mono?.6:.6)+size*.6, id='tc'+(clipN++);
  svg.querySelector('defs').insertAdjacentHTML('beforeend',`<clipPath id="${id}"><rect x="${x-4}" y="${y-size*1.1}" width="0" height="${size*1.6}"/></clipPath>`);
  el.setAttribute('clip-path',`url(#${id})`);
  tl.fromTo(`#${id} rect`,{attr:{width:0}},{attr:{width:w},duration:dur,ease:`steps(${str.length})`},at);
}
/* camera moves: tween the group's transform attribute directly */
const camT=c=>`translate(${c[0]} ${c[1]}) rotate(${c[3]||0}) scale(${c[2]})`;
function cam(tl,sel,a,b,dur,ease,at,first=true){tl.fromTo(sel,{attr:{transform:camT(a)}},{attr:{transform:camT(b)},duration:dur,ease,immediateRender:first},at);}
function rows(list,w){ // monitoring rows
  return list.map((r,i)=>{
    let p=[];for(let k=0;k<=12;k++){const x=210+k*22;const amp=r[3]?(4+k*1.7):6;const y=37+Math.sin(k*1.3+i)*amp*(k%2?1:-.6);p.push(x+','+y.toFixed(1));}
    return `<g class="row" ${idA(r[4])} transform="translate(40 ${110+i*92})"><rect width="${w}" height="74" rx="14" fill="#FFFFFF" fill-opacity=".08"/><rect class="hl" width="${w}" height="74" rx="14" fill="none" stroke="${C.red}" stroke-width="5" opacity="0"/><text x="28" y="48" font-size="30" class="mono" fill="#FFFFFF">${r[0]}</text><polyline points="${p.join(' ')}" fill="none" stroke="${C.sky}" stroke-width="4" stroke-linejoin="round"/><circle class="dot" cx="${w-200}" cy="37" r="14" fill="${r[2]}"/><text class="st" x="${w-172}" y="47" font-size="26" fill="#FFFFFF">${r[1]}</text>${r[3]?`<text class="st2" x="${w-172}" y="47" font-size="26" font-weight="700" fill="${C.red}" opacity="0">Alert</text>`:''}</g>`;
  }).join('');
}

/* =====================================================================
   shared design system
   ===================================================================== */
/* ---------- shared design helpers ---------- */
let lrN=0;
/* line-mask reveal: text slides up from behind a clip */
function LR(x,y,str,o={}){const {size=64,weight=700,fill=C.navy,anchor='start'}=o;const id='lr'+(lrN++);
  return `<g class="lr" clip-path="url(#${id})"><clipPath id="${id}"><rect x="-200" y="${y-size*1.02}" width="2400" height="${size*1.34}"/></clipPath><text class="lrt" data-d="${Math.round(size*1.4)}" x="${x}" y="${y}" font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}">${str}</text></g>`;}
function reveal(tl,sel,at,stagger=.14){gsap.utils.toArray(sel).forEach((el,i)=>tl.from(el,{y:+el.dataset.d,duration:.9,ease:'power4.out'},at+i*stagger));}
const kick=(x,y,str,fill,anchor='start')=>`<text class="kick" x="${x}" y="${y}" font-size="24" font-weight="600" letter-spacing="5" fill="${fill}" text-anchor="${anchor}">${str}</text>`;
function gridLines(col,op){let g='';for(let x=0;x<=1920;x+=120)g+=`M${x} 0V1080`;for(let y=0;y<=1080;y+=120)g+=`M0 ${y}H1920`;return `<path d="${g}" stroke="${col}" stroke-width="1.5" opacity="${op}" fill="none"/>`;}
const bgNavy=()=>`<rect width="1920" height="1080" fill="url(#gNavy)"/>${gridLines(C.navy75,.3)}<circle class="glow" cx="960" cy="430" r="560" fill="url(#gGlow)"/>`;
const bgLight=()=>`<rect width="1920" height="1080" fill="url(#gLight)"/>${gridLines(C.navy25,.3)}<circle class="blob b1" cx="1660" cy="130" r="340" fill="${C.sky25}" opacity=".6"/><circle class="blob b2" cx="170" cy="990" r="300" fill="${C.sage50}" opacity=".55"/>`;
function constel(seed,n,col){const r=rng(seed),P=[];for(let i=0;i<n;i++)P.push([Math.round(60+r()*1800),Math.round(60+r()*960)]);let L='';
  P.forEach((p,i)=>{P.map((q,j)=>[Math.hypot(p[0]-q[0],p[1]-q[1]),j]).filter(a=>a[1]!==i).sort((a,b)=>a[0]-b[0]).slice(0,2).forEach(a=>{if(a[1]>i)L+=`<path d="M${p[0]} ${p[1]} L${P[a[1]][0]} ${P[a[1]][1]}"/>`;});});
  return `<g class="cst"><g class="cl" stroke="${col}" stroke-width="1.5" opacity=".3" fill="none">${L}</g><g class="cn" fill="${col}" opacity=".65">${P.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4"/>`).join('')}</g></g>`;}
function ambient(tl,scene,dur){tl.to(`${scene} .b1`,{x:-50,y:40,duration:dur,ease:'sine.inOut'},0);tl.to(`${scene} .b2`,{x:60,y:-40,duration:dur,ease:'sine.inOut'},0);
  tl.to(`${scene} .glow`,{scale:1.15,transformOrigin:'50% 50%',duration:dur,ease:'sine.inOut'},0);}
function cstIn(tl,scene,at){tl.from(`${scene} .cl path`,{drawSVG:0,duration:1.2,stagger:.03,ease:'power1.inOut'},at);
  tl.from(`${scene} .cn circle`,{scale:0,transformOrigin:'50% 50%',duration:.4,stagger:.03,ease:'back.out(3)'},at+.2);
  tl.to(`${scene} .cn circle`,{opacity:.25,duration:.5,stagger:{each:.07,from:'random',repeat:7,yoyo:true},ease:'sine.inOut'},at+1.6);}

/* =====================================================================
   Health data sprint – overview reel
   ===================================================================== */
const Y25='#FFF5C9', LINK='#003F8B';
function pill(id,cx,cy,text,o={}){const {size=32,fill=C.navy75,color='#FFFFFF',stroke='none'}=o;const w=Math.round(text.length*size*.56+70),h=size+40;
  return `<g id="${id}" class="pill" transform="translate(${cx} ${cy})"><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="${fill}" stroke="${stroke}" stroke-width="3"/><text y="${(size*.35).toFixed(1)}" text-anchor="middle" font-size="${size}" font-weight="700" fill="${color}">${text}</text></g>`;}
const pop=(tl,sel,t,o={})=>tl.from(sel,{scale:0,transformOrigin:'50% 50%',duration:.55,ease:'back.out(2)',...o},t);
const check=(cx,cy,r,bg,fg)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${bg}"/><path class="ck" d="M${cx-r*.45} ${cy+r*.04} L${cx-r*.1} ${cy+r*.38} L${cx+r*.5} ${cy-r*.32}" fill="none" stroke="${fg}" stroke-width="${(r*.22).toFixed(1)}" stroke-linecap="round" stroke-linejoin="round"/>`;

/* ---------- mini sprint map: shows where each part sits in the sprint ---------- */
function miniMap(id,active,dark){
  const seg=(k,x,y,w,hh,label,fill,fs)=>{const on=active.includes(k);return `<g class="mm ${on?'on':'off'}" style="opacity:${on?1:.5}"><rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="${Math.round(hh/2.8)}" fill="${fill}"${on?` stroke="${dark?'#FFFFFF':C.navy}" stroke-width="4"`:''}/><text x="${x+w/2}" y="${y+hh/2+fs*.36}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="${C.navy}">${label}</text></g>`;};
  return `<g id="${id}" class="mmap"><text x="1388" y="76" text-anchor="end" font-size="18" font-weight="600" letter-spacing="4" fill="${dark?C.sky50:C.teal75}">SPRINT MAP</text>
    ${seg('w1',1404,34,120,40,'Week 1',C.sky50,17)}${seg('w2',1530,34,120,40,'Week 2',C.sky50,17)}${seg('act',1404,80,246,26,'Activities',Y25,14)}
    ${seg('ws',1660,34,150,40,'Workshop',C.sage50,17)}${seg('ref',1660,80,150,26,'Reflection',Y25,14)}</g>`;}
function mmIn(tl,id,t){tl.from(`#${id} .mm`,{y:-20,opacity:0,duration:.4,stagger:.05,ease:'power2.out'},t);tl.from(`#${id} > text`,{opacity:0,duration:.4},t);
  tl.to(`#${id} .mm.on rect`,{attr:{'stroke-width':8},duration:.25,yoyo:true,repeat:3},t+.6);}

/* ---------- 1. Introduction: beyond describing the past, to relationships and prediction ---------- */

SCENES.forEach(s=>{if(!s[3])return;const b=document.createElement('button');b.className='chip';b.textContent=s[3];b.dataset.t=s[1];b.onclick=()=>{bigPlay.hidden=true;lastCap=null;master.seek(s[1]+.05);setPlaying(true);tick();};chapWrap.appendChild(b);});
const chips=[...chapWrap.children];
let lastCap=null;
function tick(){
  const t=master.time(); if(voUnlocked)voTick(t);
  scrub.value=Math.round(master.progress()*1000);
  timeEl.textContent=fmt(t)+' / '+fmt(master.duration());
  let c='';for(const k of CAPS){if(t>=k[0])c=k[1];}
  if(c!==lastCap){lastCap=c;capEl.textContent=c;capEl.classList.toggle('has',!!c);}
  let ci=0;chips.forEach((ch,i)=>{if(t>=+ch.dataset.t)ci=i;});chips.forEach((ch,i)=>ch.classList.toggle('active',i===ci));
}
const ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3l15 9-15 9z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="3" width="5" height="18" rx="1"/><rect x="14" y="3" width="5" height="18" rx="1"/></svg>';
function setPlaying(p){
  if(p){if(master.progress()>=1)master.restart();else master.play();}else master.pause();
  audioSync(p);
  playBtn.innerHTML=p?ICON_PAUSE:ICON_PLAY; playBtn.setAttribute('aria-label',p?'Pause':'Play');
}
playBtn.onclick=()=>{bigPlay.hidden=true;setPlaying(master.paused()||master.progress()>=1);};
bigPlay.onclick=()=>{bigPlay.hidden=true;setPlaying(true);};
document.getElementById('restartBtn').onclick=()=>{bigPlay.hidden=true;lastCap=null;master.seek(0);setPlaying(true);};
let wasPlaying=false;
scrub.addEventListener('pointerdown',()=>{wasPlaying=!master.paused();master.pause();audioSync(false);});
scrub.addEventListener('input',()=>{bigPlay.hidden=true;master.progress(scrub.value/1000);tick();});
scrub.addEventListener('change',()=>{if(wasPlaying)setPlaying(true);wasPlaying=false;});
document.getElementById('scriptList').innerHTML=CAPS.filter(c=>c[1]).map(c=>`<li>${c[1]}</li>`).join('');
const voiceBtn=document.getElementById('voiceBtn');
voiceBtn.onclick=()=>{voOn=!voOn;voiceBtn.setAttribute('aria-pressed',voOn);voTick(master.time());};
const ccBtn=document.getElementById('ccBtn');
ccBtn.onclick=()=>{const on=ccBtn.getAttribute('aria-pressed')!=='true';ccBtn.setAttribute('aria-pressed',on);capWrap.classList.toggle('on',on);};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();bigPlay.hidden=true;setPlaying(master.paused()||master.progress()>=1);}
  if(e.code==='ArrowRight')master.seek(Math.min(master.duration(),master.time()+5));
  if(e.code==='ArrowLeft')master.seek(Math.max(0,master.time()-5));
});

/* ---------- fit 1920×1080 frame to the window ---------- */
const wrap=document.getElementById('wrap'), frame=document.getElementById('frame'), vp=document.getElementById('viewport'), controls=document.getElementById('controls');
function fit(){const s=vp.clientWidth/1920;/* fill the width of the page or iframe */wrap.style.width=1920*s+'px';wrap.style.height=1080*s+'px';frame.style.transform=`scale(${s})`;controls.style.width=Math.max(300,1920*s)+'px';}
new ResizeObserver(fit).observe(vp); fit();
master.progress(0); tick();
</script>
</body>
</html>
