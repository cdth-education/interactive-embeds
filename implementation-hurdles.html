<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clearing the hurdles to implementation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
<style>
:root{
  --navy:#000f46; --ink:#1d2433; --muted:#566070; --line:#d6dbe3;
  --sky:#e6f1f7; --stand:#cddbe5; --track:#e07a52;
  --teal:#1f8a7a; --teal-l:#e1f3ef; --orange-l:#fbe9e1; --gold:#f2b632;
  --S:10%; --F:8%;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{font-family:"Lato",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45;color:var(--ink);background:#f6f8fa}
h2{font-weight:400}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.stage{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}

/* Shared column layout so cards line up with hurdles */
.row{display:grid;grid-template-columns:var(--S) repeat(5,minmax(0,1fr)) var(--F)}
.slot{padding:10px 6px;display:flex;flex-direction:column;position:relative}
.side{display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted);text-align:center;padding:6px}

/* Responses (above) */
.above{background:var(--sky)}
.above .slot{justify-content:flex-end;padding-bottom:0}
.resp{background:#fff;border:1.5px solid var(--teal);border-radius:10px;padding:9px 11px;font-size:16px;color:var(--navy);position:relative}
.resp .lbl{display:block;font-size:14px;color:var(--teal);margin-bottom:2px}
.resp::after{content:"";position:absolute;left:50%;bottom:-10px;width:2px;height:10px;background:var(--teal);transform:translateX(-50%)}
.above .slot,.below .slot{justify-content:stretch}
.resp,.barr{flex:1}
.resp.locked{border:1.5px dashed #a9b8c4;background:rgba(255,255,255,.55)}
.resp.locked > *{visibility:hidden}
.resp.locked::before{content:"?";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;color:#8a97a3}
.resp.locked::after{background:#a9b8c4}
.resp.show{animation:pop .45s ease}

/* Track strip */
.strip{position:relative;height:clamp(130px,16vw,195px);background:var(--track);overflow:hidden}
.stand{position:absolute;left:0;right:0;top:0;height:16%;background:
  radial-gradient(circle at 50% 60%,#7aa5c4 0 28%,transparent 30%) 0 0/16px 12px,
  radial-gradient(circle at 50% 60%,#e7a77f 0 28%,transparent 30%) 8px 6px/16px 12px,
  var(--stand);border-bottom:3px solid var(--navy)}
.lanes{position:absolute;left:0;right:0;top:16%;bottom:0;background:repeating-linear-gradient(180deg,transparent 0 calc(33.3% - 2px),rgba(255,255,255,.7) calc(33.3% - 2px) 33.3%)}
.startline{position:absolute;top:16%;bottom:0;left:calc(var(--S) - 1%);width:5px;background:#fff;opacity:.9}
.hurdle{position:absolute;bottom:12%;width:6.2%;transform:translateX(-50%);z-index:3;cursor:default}
.hurdle img{display:block;width:100%;height:auto}
.hurdle .tag{position:absolute;left:24%;top:-62%;transform:translateX(-50%);background:#fff;border:2.5px solid var(--navy);color:var(--navy);border-radius:10px;padding:1px 11px;font-size:clamp(18px,2.3vw,28px);line-height:1.3}
.hurdle.cleared .tag{background:var(--teal);border-color:var(--teal);color:#fff}
.hurdle.next{cursor:pointer}
.hurdle.next .tag{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.15)}}

.finish{position:absolute;bottom:12%;top:26%;left:calc(100% - var(--F)/2);width:4%;transform:translateX(-50%);z-index:2}
.finish .post{position:absolute;bottom:0;top:0;width:14%;background:repeating-linear-gradient(180deg,#fff 0 8px,var(--navy) 8px 16px);border:1.5px solid var(--navy);border-radius:3px}
.finish .l{left:0}.finish .r{right:0}
.finish .tape{position:absolute;top:45%;height:4px;width:44%;background:var(--gold);transition:transform .45s ease-in}
.finish .a{left:7%;transform-origin:left center}
.finish .b{right:7%;transform-origin:right center}
.finish.broken .a{transform:rotate(70deg)}
.finish.broken .b{transform:rotate(-70deg)}

.runner{position:absolute;bottom:12%;width:7.5%;z-index:5;left:1.2%}
.runner img{display:block;width:100%;height:auto}
.runner .leap{display:none}
.runner.run .crouch{display:none}
.runner.run .leap{display:block}
.runner.moving .leap{animation:bob .28s ease-in-out infinite alternate}
.runner.jump .leap{animation:none}
.runner.jump{animation:arc .95s cubic-bezier(.35,0,.65,1)}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-7%) rotate(-2deg)}}
@keyframes arc{0%{transform:translateY(0)}50%{transform:translateY(-75%) rotate(-7deg)}100%{transform:translateY(0)}}

.cheer{position:absolute;top:22%;transform:translateX(-50%);background:#fff;border:2px solid var(--navy);color:var(--navy);border-radius:20px;padding:2px 12px;font-size:clamp(12px,1.4vw,16px);z-index:6;opacity:0;pointer-events:none;white-space:nowrap}
.cheer.show{animation:cheer 1.3s ease forwards}
@keyframes cheer{0%{opacity:0;transform:translate(-50%,8px)}15%{opacity:1;transform:translate(-50%,0)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-6px)}}

.confetti{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.confetti i{position:absolute;top:-8%;width:7px;height:11px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(260px) rotate(540deg)}}

/* Barriers (below) */
.below{background:#fbf6f3}
.below .slot{padding-top:0}
.barr{background:#fff;border:1.5px solid var(--track);border-radius:10px;padding:9px 11px;font-size:16px;color:var(--ink);position:relative}
.barr .lbl{display:block;font-size:14px;color:#b9532d;margin-bottom:2px}
.barr::before{content:"";position:absolute;left:50%;top:-10px;width:2px;height:10px;background:var(--track);transform:translateX(-50%)}
.below .slot{padding-top:10px}
.barr.locked{border:1.5px dashed #d9c3b8;background:transparent}
.barr.locked .t{visibility:hidden}
.barr.locked .lbl{color:#a3958e}
.barr.locked::before{background:#d9c3b8}
.barr.current{box-shadow:0 0 0 3px rgba(224,122,82,.25);animation:pop .45s ease}

/* Broad headings */
.band-h{padding:9px 18px;font-size:20px;color:#fff;letter-spacing:.01em}
.band-h.top{background:var(--navy)}
.band-h.bottom{background:#b9532d}

/* Control bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fff}
.status{font-size:17.5px;color:var(--ink)}
.status span{color:var(--muted)}
.btn{font:inherit;font-size:17px;padding:11px 20px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--navy)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn:disabled{opacity:.4;cursor:default}

/* Mobile detail panel (replaces above/below rows) */
.mobile{display:none;padding:12px;gap:10px;flex-direction:column;background:#fbf6f3}
.mcard{background:#fff;border-radius:10px;padding:10px 12px;font-size:17px}
.mcard .lbl{display:block;font-size:14px;margin-bottom:2px}
.mcard.b{border:1.5px solid var(--track)} .mcard.b .lbl{color:#b9532d}
.mcard.r{border:1.5px solid var(--teal);color:var(--navy)} .mcard.r .lbl{color:var(--teal)}
.mcard.r.locked{border-style:dashed;border-color:#a9b8c4;color:#8a97a3;font-style:italic}


@keyframes pop{0%{transform:scale(.92);opacity:.2}100%{transform:scale(1);opacity:1}}

@media (max-width:820px){
  .above,.below,.band-h{display:none}
  .mobile{display:flex}
  :root{--S:12%;--F:9%}
  .strip{height:140px}
  .runner{width:12%}
  .hurdle{width:9%}
  .hurdle .tag{font-size:14px;padding:0 6px;top:-55%;border-width:2px}
  .finish{width:5%}
  .bar{flex-direction:column;align-items:stretch;text-align:center}
}
</style>
</head>

<script>
const HURDLES = [
  {b:"Staff lack knowledge of the proposed pathway", r:"Targeted education and practical guidance"},
  {b:"Responsibilities between services are unclear", r:"Workflow redesign, role clarification and governance arrangements"},
  {b:"Professionals lack time to undertake additional tasks", r:"Resource allocation or redesign of existing processes"},
  {b:"Stakeholders disagree about the pathway's value", r:"Collaborative review of evidence and local consensus building"},
  {b:"Adoption varies across services", r:"Facilitation, audit and feedback, and examination of local implementation conditions"}
];
const CHEERS = ["Cleared!","Over it!","Smooth!","Nailed it!","Flying!"];
const N = HURDLES.length;

const $ = id => document.getElementById(id);
const runner = $('runner'), finish = $('finish'), cheer = $('cheer'), btn = $('act');

let cur = 0;          // hurdle being approached / cleared
let phase = 'start';  // start | running | ready | leaping | cleared | finishing | done
let busy = false;

function num(v){ return parseFloat(getComputedStyle(document.documentElement).getPropertyValue(v)); }
function centre(i){ const S=num('--S'), F=num('--F'), C=(100-S-F)/N; return S + C*(i+0.5); }
function runnerW(){ return runner.getBoundingClientRect().width / $('strip').getBoundingClientRect().width * 100; }
const wait = ms => new Promise(r => setTimeout(r, ms));
function moveRunner(left, ms, ease){
  runner.style.transition = ms ? `left ${ms}ms ${ease||'linear'}` : 'none';
  runner.style.left = left + '%';

function render(){
  const seen = i => i < cur || (i === cur && phase !== 'start');
  const cleared = i => i < cur || (i === cur && phase === 'cleared') || phase === 'finishing' || phase === 'done';

  $('above').innerHTML = `<div class="side"></div>` + HURDLES.map((h,i)=>`<div class="slot">${
    `<div class="resp ${cleared(i)?'':'locked'} ${i===cur&&phase==='cleared'?'show':''}"><span class="lbl">Response</span><span class="t">${h.r}</span></div>`}</div>`).join('') + `<div class="side"></div>`;

  $('below').innerHTML = `<div class="side">Start</div>` + HURDLES.map((h,i)=>`<div class="slot">${
    `<div class="barr ${seen(i)?'':'locked'} ${i===cur&&phase==='ready'?'current':''}"><span class="lbl">Hurdle ${i+1}</span><span class="t">${h.b}</span></div>`}</div>`).join('') + `<div class="side">Finish</div>`;

  document.querySelectorAll('.hurdle').forEach((el,i)=>{
    el.classList.toggle('cleared', cleared(i));
    el.classList.toggle('next', i===cur && phase==='ready');
  });

  const H = HURDLES[cur];
  let m = '';
  if(H && phase !== 'start' && phase !== 'finishing' && phase !== 'done'){
    m = `<div class="mcard b"><span class="lbl">Hurdle ${cur+1}</span>${H.b}</div>` +
        (phase === 'cleared' ? `<div class="mcard r"><span class="lbl">Response</span>${H.r}</div>` : `<div class="mcard r locked"><span class="lbl">Response</span>What might help here? Have a think, then leap.</div>`);
  }
  $('mobile').innerHTML = m; $('mobile').style.display = m ? '' : 'none';
  if(!m) $('mobile').removeAttribute('style'), $('mobile').style.display = 'none';

  const status = {
    start: `On your marks. <span>${N} hurdles stand between the runner and the finish line.</span>`,
    running: `Running to hurdle ${cur+1}…`,
    ready: `Hurdle ${cur+1} ahead. <span>What might help? Have a think, then leap.</span>`,
    leaping: `Leaping…`,
    cleared: `Hurdle ${cur+1} cleared! <span>${cur<N-1?'Heading to the next one…':'Heading for the finish…'}</span>`,
    finishing: `Final stretch…`,
    done: `All ${N} hurdles cleared! <span>Every hurdle now has its response.</span>`
  }[phase];
  $('status').innerHTML = status;

  const label = {start:'Go! →', running:'Running…', ready:'Leap the hurdle ↑', leaping:'Leaping…', cleared:'Running…', finishing:'Running…', done:'↺ Run again'}[phase];
  btn.textContent = label;
  btn.disabled = ['running','leaping','cleared','finishing'].includes(phase);

}

async function runTo(i){
  phase = 'running'; render();
  runner.className = 'runner run moving';
  const from = parseFloat(runner.style.left) || 1.2;
  const to = centre(i) - runnerW() - 2;
  moveRunner(to, Math.max(500, (to-from)*55), 'ease-out');
  await wait(Math.max(500, (to-from)*55));
  runner.className = 'runner run';
  phase = 'ready'; render();
}

async function leap(){
  phase = 'leaping'; render();
  runner.className = 'runner run jump';
  const to = centre(cur) + 3.2;
  moveRunner(to, 950, 'linear');
  await wait(950);
  runner.className = 'runner run';
  cheer.style.left = centre(cur) + '%';
  cheer.textContent = CHEERS[cur % CHEERS.length];
  cheer.classList.remove('show'); void cheer.offsetWidth; cheer.classList.add('show');
  phase = 'cleared'; render();
}

async function toFinish(){
  phase = 'finishing'; render();
  runner.className = 'runner run moving';
  const from = parseFloat(runner.style.left);
  const fx = 100 - num('--F')/2;
  const to = fx - runnerW()*0.8;
  const ms = Math.max(600, (to-from)*55);
  moveRunner(to, ms, 'ease-in');
  await wait(ms*0.75);
  finish.classList.add('broken');
  await wait(ms*0.25);
  runner.className = 'runner run';
  cheer.style.left = '84%'; cheer.textContent = 'Finished!';
  cheer.classList.remove('show'); void cheer.offsetWidth; cheer.classList.add('show');
  burst();
  phase = 'done'; render();
}

function burst(){
  const c = ['#e07a52','#1f8a7a','#f2b632','#000f46','#7aa5c4'];
  let h=''; for(let i=0;i<50;i++) h += `<i style="left:${Math.random()*100}%;background:${c[i%5]};animation-duration:${1.3+Math.random()*1.4}s;animation-delay:${Math.random()*.3}s"></i>`;
  $('confetti').innerHTML = h; setTimeout(()=>$('confetti').innerHTML='', 3200);
}

function reset(){
  cur = 0; phase = 'start';
  finish.classList.remove('broken');
  runner.className = 'runner';
  moveRunner(1.2, 0);
  render();
}

async function act(){
  if(busy || btn.disabled) return; busy = true;
  try{
    if(phase==='start') await runTo(0);
    else if(phase==='ready'){
      await leap();
      await wait(450);
      if(cur<N-1){ cur++; await runTo(cur); } else { await toFinish(); }
    }
    else if(phase==='done'){ reset(); window.scrollTo({top:0,behavior:'smooth'}); }
  } finally { busy = false; }
}

btn.addEventListener('click', act);
$('hurdles').addEventListener('click', e=>{ const h=e.target.closest('.hurdle.next'); if(h) act(); });
document.addEventListener('keydown', e=>{
  if((e.code==='Space'||e.key===' ') && !(e.target.closest && e.target.closest('button'))){ e.preventDefault(); act(); }
});
window.addEventListener('resize', ()=>{
  build(); render();
  if(phase==='ready') moveRunner(centre(cur) - runnerW() - 2, 0);
  else if(phase==='cleared') moveRunner(centre(cur) + 3.2, 0);
});

build(); reset();
</script>
</body>
</html>
