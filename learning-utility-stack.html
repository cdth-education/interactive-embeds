<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Learning Utility Stack</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lato-font/3.0.0/css/lato-font.min.css">
<style>
:root{
  --ink:#1d2b33; --muted:#53636d; --line:#d3dce0;
  --l3:#eef1f2; --l3-b:#b5c0c5;
  --l2:#d3eeed; --l2-b:#7dbdbb;
  --l1:#3a8483; --l1-b:#2b6867;
  --gold:#f6e2a8; --gold-b:#d4a537; --gold-ink:#6e4c0e;
  --absent:#d4614a; --gap:#d39a2b; --built:#2f7372;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Lato",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;background:#f6f8f9;color:var(--ink);line-height:1.45}
.wrap{max-width:1360px;margin:0 auto;padding:20px}
.scroll{overflow-x:auto;padding-bottom:6px}
.grid{display:grid;gap:8px;min-width:1100px}

/* Caption strip (step text + navigation) */
.caption{grid-column:1/-1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 20px;display:flex;align-items:center;gap:24px}
.cap-text{flex:1}
.cap-step{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cap-text h2{font-size:23px;font-weight:900;margin:2px 0 4px}
.cap-text p{font-size:16.5px;color:#33444d;max-width:900px}
.nav{display:flex;gap:8px;flex-shrink:0}
.btn{font:inherit;font-size:15px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* Headers */
.corner{display:flex;flex-direction:column;justify-content:flex-end;padding:0 4px 10px;border-bottom:2px solid var(--line);font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.colhead{display:flex;flex-direction:column;justify-content:flex-end;padding:6px 6px 10px;border-bottom:2px solid var(--line);text-align:center}
.colhead .name{font-size:21px;font-weight:900}
.colhead .intro{font-size:14px;color:var(--muted);margin-top:3px}
.colhead.locked .name{color:#b8c3c8}
.colhead.active{border-bottom-color:var(--ink)}
.colhead.trans .name{color:var(--gold-ink)}
.colhead.trans.active{border-bottom-color:var(--gold-b)}
.colhead.trans.locked .name{color:#d6c79f}

/* Row heads */
.rowhead{padding:16px;border-radius:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-height:130px}
.rowhead h3{font-size:18.5px;font-weight:900;line-height:1.25}
.rowhead p{font-size:15px;color:var(--muted)}
.rowhead.l3{background:var(--l3)}
.rowhead.l2{background:var(--l2)}
.rowhead.l1{background:var(--l1);color:#fff}
.rowhead.l1 p{color:rgba(255,255,255,.9)}
.badge{display:inline-block;font-size:13px;font-weight:900;letter-spacing:.04em;padding:4px 10px;border-radius:6px;color:#fff;margin-top:2px}
.badge.absent{background:var(--absent)}
.badge.gap{background:var(--gap)}
.badge.built{background:#fff;color:var(--built)}

/* Layer cards (layer-building steps) */
.layercard{border-radius:8px;padding:18px 20px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px;border:1.5px dashed var(--l3-b)}
.layercard.l3{background:var(--l3)}
.layercard.l2{background:var(--l2);border-color:var(--l2-b)}
.layercard.l1{background:var(--l1);border:1.5px solid var(--l1-b);color:#fff}
.lc-k{display:block;font-size:13px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.layercard.l1 .lc-k{color:rgba(255,255,255,.78)}
.layercard p{font-size:16.5px}
.note{border-radius:8px;border:1.5px dashed var(--l3-b);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted);font-style:italic;padding:16px}
.note.l2{border-color:var(--l2-b);background:rgba(211,238,237,.35)}
.note.l1{border-color:var(--l1-b);background:rgba(58,132,131,.12)}
.note.l3{background:rgba(238,241,242,.6)}

/* Cells */
.cell{border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:7px;border:1.5px dashed var(--l3-b);min-height:130px}
.cell.l3{background:var(--l3)}
.cell.l2{background:var(--l2);border-color:var(--l2-b)}
.cell.l1{background:var(--l1);border:1.5px solid var(--l1-b)}
.cell.empty{opacity:.35}
.pchip{font-size:15px;padding:7px 10px;border-radius:6px;background:#fff;border:1px solid var(--line);cursor:help;outline:none}
.pchip:focus-visible{box-shadow:0 0 0 2px #4c8bf5}
.cell.l1 .pchip{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.38);color:#fff}

/* Insight row */
.ihead{padding:14px 16px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center}
.icell{border-radius:8px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--l1);padding:12px 14px;font-size:14.5px;color:#33444d}
.icell.empty{border-top-color:var(--line);background:transparent;border-style:dashed;opacity:.5}
.icell.gold{border-top-color:var(--gold-b);background:#fdf6e3}

/* Translator band */
.band{background:var(--gold);border:1.5px solid var(--gold-b);border-radius:8px;padding:12px 10px;display:flex;flex-direction:column;justify-content:space-around;gap:8px}
.band.locked{background:#f8f2e0;border-style:dashed;align-items:center;justify-content:center;text-align:center;font-size:15px;color:var(--gold-ink);font-style:italic;padding:16px}
.tcard{background:#fff8e4;border:1px solid var(--gold-b);border-radius:8px;padding:12px;color:var(--gold-ink)}
.tcard b{display:block;font-size:16px;font-weight:900;text-align:center;margin-bottom:4px}
.tcard span{display:block;font-size:13.5px;line-height:1.4}
.tarrow{text-align:center;color:var(--gold-b);font-size:22px;line-height:1}

/* Takeaway row */
.takeaways{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.take{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:16px}
.take b{display:block;font-size:18px;font-weight:900;margin-bottom:4px}

.new{animation:pop .45s ease both}
.rise{animation:rise .5s ease both}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes rise{0%{transform:translateY(16px);opacity:0}100%{transform:translateY(0);opacity:1}}

#tip{position:fixed;z-index:50;max-width:290px;background:#1d2b33;color:#fff;font-size:14px;line-height:1.45;padding:9px 12px;border-radius:7px;pointer-events:none;opacity:0;transition:opacity .12s;top:0;left:0}
#tip.show{opacity:1}
</style>
</head>
<body>
<div class="wrap"><div class="scroll"><div class="grid" id="grid"></div></div></div>
<div id="tip" role="tooltip"></div>

<script>
const LAYERS = {
  3:{n:3, cls:'l3', title:'Layer 3: Enabling Environment', desc:'What makes it sustainable — governance, trust, alignment',
     badge:'ABSENT', bcls:'absent',
     body:'The rules, incentives and agreements that let the whole system persist across organisations and over time — so learning isn\'t lost when a project ends.',
     status:'Largely absent. Few health systems have the shared frameworks, incentives or agreements this layer needs.',
     note:'Top of the stack — completes it'},
  2:{n:2, cls:'l2', title:'Layer 2: Machinery', desc:'What makes it learn — feedback loops, monitoring, maintenance',
     badge:'GAP', bcls:'gap',
     body:'The processes that turn infrastructure into a system that learns: capturing decisions, tracking outcomes, watching for drift and keeping tools maintained.',
     status:'A documented gap. This work is rarely funded, staffed or measured.',
     note:'Sits on the foundation'},
  1:{n:1, cls:'l1', title:'Layer 1: Foundation', desc:'What you build — data, compute, AI tools',
     badge:'BUILT — but project-by-project', bcls:'built',
     body:'The tangible infrastructure: data assets, computing power, technical standards and AI tools, plus the technical people who build them.',
     status:'Built — but one project at a time, rather than as shared infrastructure.',
     note:'The base — everything else sits on top'}
};

const COLS = [
  {name:'Data', intro:'What data exists, how it moves, and whether outcomes come back',
   insight:'Data has been assembled, but decisions and outcomes rarely flow back — so the system can\'t learn from what it does.',
   items:[
    {t:'Sharing agreements', l:3, tip:'Formal agreements that allow data to move between organisations under agreed rules.'},
    {t:'Federated norms', l:3, tip:'Shared conventions so data held in different places can be analysed together without centralising it.'},
    {t:'Learning-loop obligations', l:3, tip:'Requirements that organisations feed outcomes back so the wider system keeps learning.'},
    {t:'Decision capture', l:2, tip:'Recording what decision was made, by whom, and with what AI or decision-support input.'},
    {t:'Outcome tracking', l:2, tip:'Following what actually happened to patients after a decision was made.'},
    {t:'Return-path pipelines', l:2, tip:'Routes that carry outcome data back to the teams and models that need it.'},
    {t:'EHR / OMOP', l:1, tip:'Electronic health records, and the OMOP common data model that standardises them for analysis.'},
    {t:'Multimodal commons', l:1, tip:'Shared data pools that combine imaging, genomics, clinical notes and other data types.'},
    {t:'Federated architecture', l:1, tip:'A technical set-up that keeps data where it is while still allowing distributed analysis.'}
   ]},
  {name:'Technology', intro:'The platforms and tools, and whether they\'re kept working',
   insight:'Tools are being bought, but monitoring and maintaining them is rarely funded — so performance can quietly degrade after go-live.',
   items:[
    {t:'Interoperability mandates', l:3, tip:'Requirements that systems must exchange data in standard, compatible ways.'},
    {t:'Platform standards', l:3, tip:'Agreed specifications that platforms across the sector must meet.'},
    {t:'Procurement lifecycle', l:3, tip:'Purchasing rules that cover a tool\'s whole life — not just the point of sale.'},
    {t:'Monitoring systems', l:2, tip:'Tools that watch how systems and AI models perform in live use.'},
    {t:'Drift detection', l:2, tip:'Spotting when a model\'s performance shifts as data, practice or patient populations change.'},
    {t:'Lifecycle maintenance', l:2, tip:'Ongoing updating, retraining and eventual retirement of tools.'},
    {t:'Compute / cloud', l:1, tip:'Processing power and storage, whether on-premises or in the cloud.'},
    {t:'FHIR + security', l:1, tip:'FHIR is the HL7 standard for exchanging health data through APIs, paired with security controls.'},
    {t:'AI tools and CDS', l:1, tip:'AI models and clinical decision support (CDS) embedded in clinical workflows.'}
   ]},
  {name:'Workforce', intro:'Who builds the system, runs it, and governs it',
   insight:'The field hires people to build. Few are employed to maintain, monitor and assure systems, or to govern across them.',
   items:[
    {t:'Governance leads', l:3, tip:'Senior people accountable for how data and AI are governed across an organisation or network.'},
    {t:'Policy experts', l:3, tip:'Specialists who shape the regulations, standards and policies the system operates under.'},
    {t:'Accountability officers', l:3, tip:'Roles that answer for outcomes when systems cause harm or fall short.'},
    {t:'Maintenance engineers', l:2, tip:'Keep deployed systems running, patched and up to date after go-live.'},
    {t:'Monitoring specialists', l:2, tip:'Watch live performance, safety signals and drift, and raise the alarm when needed.'},
    {t:'QA leads', l:2, tip:'Own quality assurance — testing and checking that systems keep meeting standards.'},
    {t:'Data engineers', l:1, tip:'Build the pipelines that collect, clean and move data.'},
    {t:'System admins', l:1, tip:'Run and secure the servers, networks and platforms.'},
    {t:'ML engineers', l:1, tip:'Build, train and deploy machine-learning models.'}
   ]},
  {name:'Governance', intro:'The rules — from data access to shared commitments',
   insight:'Governance mostly controls access. Ongoing performance standards and shared commitments to learn together are largely missing.',
   items:[
    {t:'Trust frameworks', l:3, tip:'Shared rules that let patients, clinicians and organisations trust how data and AI are used.'},
    {t:'Incentive alignment', l:3, tip:'Making sure funding, payment and reward structures encourage ongoing learning rather than one-off projects.'},
    {t:'Learning compact', l:3, tip:'A shared commitment among organisations to contribute to, and learn from, a common system.'},
    {t:'Performance standards', l:2, tip:'Agreed benchmarks that deployed tools must keep meeting over time.'},
    {t:'Retraining protocols', l:2, tip:'Rules for when and how a model must be retrained, adjusted or retired.'},
    {t:'Monitoring SLAs', l:2, tip:'Service-level agreements setting how often systems are checked and how quickly problems are fixed.'},
    {t:'Data access policy', l:1, tip:'Rules about who can access which data, and for what purpose.'},
    {t:'IRB / privacy', l:1, tip:'Ethics review by institutional review boards, plus privacy protections for research and data use.'},
    {t:'Procurement', l:1, tip:'The process for buying data, infrastructure and tools.'}
   ]}
];

const TRANS = [
  {t:'Clinical ↔ Technical', d:'Turns clinical needs into technical requirements, and technical limits into clinical terms.'},
  {t:'Research ↔ Operations', d:'Moves evidence into day-to-day practice, and brings operational reality back to research.'},
  {t:'Governance ↔ Technical', d:'Turns policy into technical controls, and explains technical risk to decision-makers.'}
];

/* Steps: 0 overview | 1–3 layers | 4–7 dimensions | 8 translators */
const CAPTIONS = [
  {k:'Introduction', h:'How to read this table',
   p:'Rows are three layers of infrastructure, stacked from the bottom up. Columns are four dimensions that cut across every layer. Darker shading means more investment. We\'ll build it one layer at a time.', next:'Start with Layer 1'},
  {k:'Building the stack · 1 of 3', h:'Layer 1: Foundation', p:'We start at the bottom — the layer that most investment has gone into.', next:'Add Layer 2'},
  {k:'Building the stack · 2 of 3', h:'Layer 2: Machinery', p:'Sits on the foundation, and turns built infrastructure into a system that actually learns.', next:'Add Layer 3'},
  {k:'Building the stack · 3 of 3', h:'Layer 3: Enabling Environment', p:'Completes the stack. Notice the pattern moving upwards: built, then a gap, then largely absent.', next:'Add the dimensions'},
  {k:'Dimension 1 of 4', h:'Data', p:'Each layer plays out across four dimensions. Hover over or tap any item for a plain-language explanation.', next:'Add Technology'},
  {k:'Dimension 2 of 4', h:'Technology', p:'The same layered pattern appears in the platforms and tools.', next:'Add Workforce'},
  {k:'Dimension 3 of 4', h:'Workforce', p:'Who does the work at each layer — and who\'s missing.', next:'Add Governance'},
  {k:'Dimension 4 of 4', h:'Governance', p:'The rules at each layer, from controlling access to committing to learn together.', next:'Add the translators'},
  {k:'Across the layers', h:'Translators', p:'Some roles don\'t sit in a single layer. They bridge clinical, research, technical, operational and governance worlds — connecting what gets built to what keeps it learning and what makes it last.', next:null}
];
const LAST = 8;
let step = 0, prevStep = null;

const esc = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const grid = document.getElementById('grid');

function render(){
  const overview = step===0;
  const vis = (overview || step>=3) ? [3,2,1] : step===2 ? [2,1] : [1];
  const dimsMode = step>=4;
  const revealed = dimsMode ? step-3 : 0;
  const showHeaders = overview || dimsMode;
  const showBand = overview || step===8;
  const fwd = prevStep!==null && step>prevStep;
  const newLayer = fwd && step>=1 && step<=3 ? step : null;
  const newDim = fwd && step>=4 && step<=7 ? step-4 : null;
  const bandArrives = fwd && step===8;

  grid.style.gridTemplateColumns = '250px repeat(4,minmax(165px,1fr))' + (showBand ? ' 240px' : '');

  const c = CAPTIONS[step];
  let h = `<div class="caption" style="grid-row:1">
    <div class="cap-text"><div class="cap-step">${c.k}</div><h2>${c.h}</h2><p>${c.p}</p></div>
    <div class="nav">
      <button class="btn" data-action="back" ${step===0?'disabled':''}>← Back</button>
      ${c.next ? `<button class="btn primary" data-action="next">${c.next} →</button>` : `<button class="btn primary" data-action="restart">↺ Start again</button>`}
    </div></div>`;

  let row = 2;
  if(showHeaders){
    h += `<div class="corner" style="grid-row:${row};grid-column:1">Layers</div>`;
    COLS.forEach((col,ci)=>{
      const on = dimsMode && ci<revealed;
      const cur = dimsMode && ci===revealed-1 && step<=7;
      h += `<div class="colhead ${on||overview?'':'locked'} ${cur?'active':''} ${ci===newDim?'new':''}" style="grid-row:${row};grid-column:${ci+2}">
        <span class="name">${col.name}</span>${on?`<span class="intro">${col.intro}</span>`:''}</div>`;
    });
    if(showBand) h += `<div class="colhead trans ${overview?'locked':'active'} ${bandArrives?'new':''}" style="grid-row:${row};grid-column:6"><span class="name">Translators</span>${overview?'':'<span class="intro">Roles that bridge the layers</span>'}</div>`;
    row++;
  }

  const first = row;
  vis.forEach(n=>{
    const L = LAYERS[n], isNew = n===newLayer;
    h += `<div class="rowhead ${L.cls} ${isNew?'rise':''}" style="grid-row:${row};grid-column:1">
      <h3>${L.title}</h3>${dimsMode ? '' : `<p>${L.desc}</p>${overview?'':`<span class="badge ${L.bcls}">${L.badge}</span>`}`}</div>`;
    if(overview){
      h += `<div class="note ${L.cls}" style="grid-row:${row};grid-column:2/6">${L.note}</div>`;
    } else if(!dimsMode){
      h += `<div class="layercard ${L.cls} ${isNew?'rise':''}" style="grid-row:${row};grid-column:2/6">
        <div><span class="lc-k">What it is</span><p>${L.body}</p></div>
        <div><span class="lc-k">Where the field is</span><p>${L.status}</p></div></div>`;
    } else {
      COLS.forEach((col,ci)=>{
        const filled = ci<revealed;
        const items = filled ? col.items.filter(it=>it.l===n).map(it=>`<span class="pchip" tabindex="0" data-tip="${esc(it.tip)}">${it.t}</span>`).join('') : '';
        h += `<div class="cell ${L.cls} ${filled?'':'empty'} ${ci===newDim?'new':''}" style="grid-row:${row};grid-column:${ci+2}">${items}</div>`;
      });
    }
    row++;
  });

  if(showBand){
    if(overview){
      h += `<div class="band locked" style="grid-column:6;grid-row:${first}/${row}">Roles that connect the layers</div>`;
    } else {
      h += `<div class="band ${bandArrives?'new':''}" style="grid-column:6;grid-row:${first}/${row}">
        <div style="font-size:14px;font-style:italic;color:var(--gold-ink);text-align:center;">Cross-layer bridge roles — the workforce the field has not professionalised</div>
        ${TRANS.map((t,i)=>`<div class="tcard"><b>${t.t}</b><span>${t.d}</span></div>${i<TRANS.length-1?'<div class="tarrow" aria-hidden="true">↕</div>':''}`).join('')}</div>`;
    }
  }

  if(step===8){
    h += `<div class="takeaways new" style="grid-row:${row}">
      <div class="take"><b>The field built Layer 1.</b>The learning utility requires all three layers — and the translators who connect them.</div>
      <div class="take"><b>Invest differently, not more.</b>The next Layer 1 dollar is worth less than the first Layer 2 or Layer 3 dollar.</div>
    </div>`;
  }

  grid.innerHTML = h;
}

function go(i){
  if(i<0 || i>LAST) return;
  prevStep = step; step = i; hideTip(); render();
}

grid.addEventListener('click', e=>{
  const a = e.target.closest('[data-action]'); if(!a || a.disabled) return;
  if(a.dataset.action==='next') go(step+1);
  if(a.dataset.action==='back') go(step-1);
  if(a.dataset.action==='restart') go(0);
});

/* Tooltips */
const tip = document.getElementById('tip');
function showTip(el){
  const t = el.dataset.tip; if(!t){ hideTip(); return; }
  tip.textContent = t; tip.classList.add('show');
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = r.left + r.width/2 - tw/2; x = Math.max(8, Math.min(x, window.innerWidth - tw - 8));
  let y = r.top - th - 8; if(y < 8) y = r.bottom + 8;
  tip.style.left = x+'px'; tip.style.top = y+'px';
}
function hideTip(){ tip.classList.remove('show'); }
document.addEventListener('mouseover', e=>{ const el = e.target.closest('[data-tip]'); el ? showTip(el) : hideTip(); });
document.addEventListener('focusin', e=>{ const el = e.target.closest('[data-tip]'); el ? showTip(el) : hideTip(); });
document.addEventListener('focusout', hideTip);
document.addEventListener('scroll', hideTip, true);

render();
</script>
</body>
</html>
