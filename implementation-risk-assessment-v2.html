  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

16px 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 2px rgba(0,11,52,.08)\">\n<p style=\"margin: 0; padding-bottom: 10px; border-bottom: 1px solid #E4E4E4; font-size: 17px; font-weight: 600; color: #000B34\">{{sc.prompt}}<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 2px\">\n<div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 12px\">\n<label for=\"likelihood\" style=\"font-weight: 700; font-size: 17px; color: #000F46\">Likelihood of it happening<\u002Flabel>\n<span class=\"swap\" style=\"font-weight: 700; font-size: 18px; color: #000F46; justify-items: end\" aria-hidden=\"true\">\n<sc-for list=\"{{lOpts}}\" as=\"o\" hint-placeholder-count=\"3\"><span style=\"opacity: {{o.op}}; transform: translateY({{o.y}}px)\">{{o.n}}<\u002Fspan><\u002Fsc-for>\n<\u002Fspan>\n<\u002Fdiv>\n<input id=\"likelihood\" type=\"range\" min=\"0\" max=\"2\" step=\"1\" value=\"{{cur.l}}\" sc-camel-on-change=\"{{setL}}\" aria-valuetext=\"{{lName}}\">\n<div style=\"display: flex; justify-content: space-between; font-size: 14px; color: #616161\" aria-hidden=\"true\">\n<span>Low<\u002Fspan><span>Medium<\u002Fspan><span>High<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 2px\">\n<div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 12px\">\n<label for=\"severity\" style=\"font-weight: 700; font-size: 17px; color: #000F46\">Severity if it happens<\u002Flabel>\n<span class=\"swap\" style=\"font-weight: 700; font-size: 18px; color: #000F46; justify-items: end\" aria-hidden=\"true\">\n<sc-for list=\"{{sOpts}}\" as=\"o\" hint-placeholder-count=\"4\"><span style=\"opacity: {{o.op}}; transform: translateY({{o.y}}px)\">{{o.n}}<\u002Fspan><\u002Fsc-for>\n<\u002Fspan>\n<\u002Fdiv>\n<input id=\"severity\" type=\"range\" min=\"0\" max=\"3\" step=\"1\" value=\"{{cur.s}}\" sc-camel-on-change=\"{{setS}}\" aria-valuetext=\"{{sName}}\">\n<div style=\"display: flex; justify-content: space-between; font-size: 14px; color: #616161\" aria-hidden=\"true\">\n<span>Acceptable<\u002Fspan><span>Tolerable<\u002Fspan><span>Undesirable<\u002Fspan><span>Intolerable<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<aside style=\"flex: 1 1 360px; min-width: 0; background: #FFFFFF; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 1px 2px rgba(0,11,52,.08)\">\n<div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #616161\">Risk meter<\u002Fdiv>\n<svg sc-camel-view-box=\"0 0 300 170\" width=\"100%\" style=\"max-width: 300px\" role=\"img\" aria-label=\"Risk meter showing {{rName}} risk\">\n<path d=\"M20 150 A130 130 0 0 1 58.08 58.08 L93.43 93.43 A80 80 0 0 0 70 150 Z\" fill=\"#FFEA94\" stroke=\"#FFFFFF\" stroke-width=\"3\"><\u002Fpath>\n<path d=\"M58.08 58.08 A130 130 0 0 1 150 20 L150 70 A80 80 0 0 0 93.43 93.43 Z\" fill=\"#FFD629\" stroke=\"#FFFFFF\" stroke-width=\"3\"><\u002Fpath>\n<path d=\"M150 20 A130 130 0 0 1 241.92 58.08 L206.57 93.43 A80 80 0 0 0 150 70 Z\" fill=\"#FF616D\" stroke=\"#FFFFFF\" stroke-width=\"3\"><\u002Fpath>\n<path d=\"M241.92 58.08 A130 130 0 0 1 280 150 L230 150 A80 80 0 0 0 206.57 93.43 Z\" fill=\"#FF2D3C\" stroke=\"#FFFFFF\" stroke-width=\"3\"><\u002Fpath>\n<text x=\"53\" y=\"114\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#000B34\" font-family=\"Source Sans 3, sans-serif\">Low<\u002Ftext>\n<text x=\"108\" y=\"57\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#000B34\" font-family=\"Source Sans 3, sans-serif\">Medium<\u002Ftext>\n<text x=\"192\" y=\"57\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#000B34\" font-family=\"Source Sans 3, sans-serif\">High<\u002Ftext>\n<text x=\"247\" y=\"114\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#000B34\" font-family=\"Source Sans 3, sans-serif\">Extreme<\u002Ftext>\n<g style=\"transform: rotate({{needleDeg}}deg); transform-origin: 150px 150px; transition: transform 1.3s cubic-bezier(.45,0,.2,1)\">\n<path d=\"M146 150 L150 32 L154 150 Z\" fill=\"#2D2D2D\"><\u002Fpath>\n<\u002Fg>\n<circle cx=\"150\" cy=\"150\" r=\"11\" fill=\"#2D2D2D\"><\u002Fcircle>\n<circle cx=\"150\" cy=\"150\" r=\"4\" fill=\"#FFFFFF\"><\u002Fcircle>\n<\u002Fsvg>\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px\" aria-live=\"polite\">\n<div style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #616161\">Your risk rating<\u002Fdiv>\n<div class=\"swap\" style=\"font-family: 'Source Serif 4', Georgia, serif; font-size: 26px; font-weight: 700; padding: 2px 20px; border-radius: 8px; background: {{rBg}}; color: {{rFg}}; justify-items: center; transition: background .8s ease .3s\">\n<sc-for list=\"{{rOpts}}\" as=\"o\" hint-placeholder-count=\"4\"><span style=\"opacity: {{o.op}}; transform: translateY({{o.y}}px); transition-delay: {{o.d}}s\">{{o.n}}<\u002Fspan><\u002Fsc-for>\n<\u002Fdiv>\n<span style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">{{rName}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Faside>\n<\u002Fdiv>\n\n<section style=\"background: #FFFFFF; border-radius: 10px; padding: 14px 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 2px rgba(0,11,52,.08)\">\n<sc-if value=\"{{notRevealed}}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"fade-in\" style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px\">\n<p style=\"margin: 0; color: #616161\">{{revealHint}}<\u002Fp>\n<button class=\"primary\" type=\"button\" sc-camel-on-click=\"{{reveal}}\" disabled=\"{{revealDisabled}}\" style=\"min-height: 44px; padding: 0 24px; border: 0; border-radius: 8px; background: #000F46; color: #FFFFFF; font-size: 17px; font-weight: 700\">Reveal expert assessment<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{cur.rev}}\" hint-placeholder-val=\"{{ false }}\">\n<div class=\"fade-in\" style=\"display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; background: {{fbBg}}; transition: background .5s ease\">\n<sc-if value=\"{{match}}\" hint-placeholder-val=\"{{ true }}\">\n<svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#444A40\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M7.5 12.5l3 3 6-6.5\"><\u002Fpath><\u002Fsvg>\n<\u002Fsc-if>\n<sc-if value=\"{{noMatch}}\" hint-placeholder-val=\"{{ false }}\">\n<svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#000F46\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 7v6\"><\u002Fpath><path d=\"M12 16.5v.5\"><\u002Fpath><\u002Fsvg>\n<\u002Fsc-if>\n<div style=\"flex: 1 1 300px; display: flex; flex-direction: column; gap: 2px\">\n<div style=\"font-weight: 700; color: #000B34; font-size: 18px\">{{fbTitle}}<\u002Fdiv>\n<div style=\"color: #2D2D2D\">{{fbText}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px 20px\">\n<div style=\"flex: 999 1 420px; display: flex; flex-direction: column; gap: 4px\">\n<div style=\"font-weight: 700; color: #000F46\">Mitigation strategy<\u002Fdiv>\n<p style=\"margin: 0\">{{sc.mit}}<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 200px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start\">\n<div style=\"font-weight: 700; color: #000F46\">Residual risk after mitigation<\u002Fdiv>\n<div style=\"font-weight: 700; padding: 4px 16px; border-radius: 6px; background: {{resBg}}; color: {{resFg}}\">{{sc.residual}}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsection>\n\n<nav style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\" aria-label=\"Scenario navigation\">\n<button class=\"navbtn\" type=\"button\" sc-camel-on-click=\"{{prev}}\" disabled=\"{{prevDisabled}}\" style=\"min-height: 44px; padding: 0 20px; border: 2px solid #000F46; border-radius: 8px; background: #FFFFFF; color: #000F46; font-size: 16px; font-weight: 700\">Previous<\u002Fbutton>\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 6px\">\n<div style=\"font-size: 14px; font-weight: 700; color: #000F46\">Scenario {{num}} of {{total}}<\u002Fdiv>\n<div style=\"display: flex; gap: 6px\" aria-hidden=\"true\">\n<sc-for list=\"{{dots}}\" as=\"dot\" hint-placeholder-count=\"5\">\n<span style=\"display: block; width: 24px; height: 6px; border-radius: 3px; background: {{dot.bg}}; transition: background .4s ease\"><\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<button class=\"primary\" type=\"button\" sc-camel-on-click=\"{{next}}\" style=\"min-height: 44px; padding: 0 24px; border: 0; border-radius: 8px; background: #000F46; color: #FFFFFF; font-size: 16px; font-weight: 700\">{{nextLabel}}<\u002Fbutton>\n<\u002Fnav>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{showSummary}}\" hint-placeholder-val=\"{{ false }}\">\n<main class=\"fade-in\" style=\"max-width: 1080px; margin: 0 auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"background: #FFFFFF; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 2px rgba(0,11,52,.08)\">\n<h2 style=\"margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 28px; color: #000F46\">Your risk register<\u002Fh2>\n<p style=\"margin: 0\">You matched the expert risk rating on <strong>{{matches}} of {{total}}<\u002Fstrong> scenarios. Compare your ratings below.<\u002Fp>\n<div style=\"overflow-x: auto\">\n<sc-raw-table style=\"width: 100%; min-width: 640px; border-collapse: collapse; font-size: 16px\">\n<sc-raw-thead>\n<sc-raw-tr style=\"text-align: left; color: #000F46\">\n<sc-raw-th style=\"padding: 10px 12px; border-bottom: 2px solid #000F46\">Risk<\u002Fsc-raw-th>\n<sc-raw-th style=\"padding: 10px 12px; border-bottom: 2px solid #000F46\">Your rating<\u002Fsc-raw-th>\n<sc-raw-th style=\"padding: 10px 12px; border-bottom: 2px solid #000F46\">Expert rating<\u002Fsc-raw-th>\n<sc-raw-th style=\"padding: 10px 12px; border-bottom: 2px solid #000F46\">Residual risk<\u002Fsc-raw-th>\n<sc-raw-th style=\"padding: 10px 12px; border-bottom: 2px solid #000F46\">Result<\u002Fsc-raw-th>\n<\u002Fsc-raw-tr>\n<\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-for list=\"{{summary}}\" as=\"row\" hint-placeholder-count=\"5\">\n<sc-raw-tr>\n<sc-raw-td style=\"padding: 12px; border-bottom: 1px solid #E4E4E4; font-weight: 600\">{{row.risk}}<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 12px; border-bottom: 1px solid #E4E4E4\">{{row.you}}<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 12px; border-bottom: 1px solid #E4E4E4\"><span style=\"display: inline-block; padding: 2px 10px; border-radius: 4px; font-weight: 700; background: {{row.bg}}; color: {{row.fg}}\">{{row.expert}}<\u002Fspan><\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 12px; border-bottom: 1px solid #E4E4E4\">{{row.residual}}<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding: 12px; border-bottom: 1px solid #E4E4E4; font-weight: 700; color: {{row.color}}\">{{row.result}}<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<\u002Fsc-for>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap\">\n<button class=\"navbtn\" type=\"button\" sc-camel-on-click=\"{{prev}}\" style=\"min-height: 48px; padding: 0 22px; border: 2px solid #000F46; border-radius: 8px; background: #FFFFFF; color: #000F46; font-size: 16px; font-weight: 700\">Back to scenario 5<\u002Fbutton>\n<button class=\"primary\" type=\"button\" sc-camel-on-click=\"{{restart}}\" style=\"min-height: 48px; padding: 0 26px; border: 0; border-radius: 8px; background: #000F46; color: #FFFFFF; font-size: 16px; font-weight: 700\">Start again<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:1180}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.L = ['Low', 'Medium', 'High'];\n    this.S = ['Acceptable', 'Tolerable', 'Undesirable', 'Intolerable'];\n    this.R = ['Low', 'Medium', 'High', 'Extreme'];\n    this.M = [[0, 0, 1, 2], [0, 1, 1, 2], [1, 2, 2, 3]];\n    this.BG = ['#FFEA94', '#FFD629', '#FF616D', '#FF2D3C'];\n    this.FG = ['#000B34', '#000B34', '#000B34', '#000B34'];\n    this.SC = [\n      {\n        risk: 'No buy-in from clinicians / end users',\n        title: 'Urology: a sceptical head of unit',\n        text: 'AI transcription is about to replace human typists across all clinical teams. The head of urology, a prominent and well-known urologist who has practised for 30 years, has said he is not convinced by the change. His junior doctors and nurses tend to follow his lead, and his view could shape whether the team takes up the new tool.',\n        prompt: 'How likely is it that clinicians and end users will not buy in to the tool, and how severe would that be?',\n        l: 0, s: 2, residual: 'Low',\n        mit: 'Identify clinician champions, add general medicine clinicians and administrators to the steering committee, and send written communications monthly before scale-up.'\n      },\n      {\n        risk: 'Technical issues',\n        title: 'Oncology: keeping up with new therapies',\n        text: 'Oncology documentation regularly includes the names of oral chemotherapies, and new therapies are released often. The AI transcription tool may not recognise newer drug names, and its accuracy could drift over time. If that happens, the oncology team would need to spend extra time checking that therapy names are captured correctly.',\n        prompt: 'How likely is it that technical issues like this will occur, and how severe would they be?',\n        l: 1, s: 2, residual: 'Low',\n        mit: 'Establish regular communication channels between IT and the project manager. Assess the need for helpdesks and support systems.'\n      },\n      {\n        risk: 'Workflow issues between organisational settings',\n        title: 'Nurses moving between inpatient units and urgent care',\n        text: 'Nurses rotate between inpatient units and the urgent care clinic. On inpatient units they can usually step into an empty room to dictate between patient consultations. Urgent care is faster-paced with little quiet space, so nurses may not get to their AI transcription until the end of a shift, when it is harder to recall each patient interaction.',\n        prompt: 'How likely is it that workflow differences between settings will cause problems, and how severe would that be?',\n        l: 2, s: 1, residual: 'Medium',\n        mit: 'Provide specific training for each clinic, including workflow mapping, and gather feedback from each clinic following implementation.'\n      },\n      {\n        risk: 'Data security breach',\n        title: 'Patient data held by a third-party vendor',\n        text: 'Under the proposed policy, dictation recordings will be processed by a third-party AI transcription vendor. Raw audio, automated transcripts and associated metadata will be stored on the vendor’s cloud and in the hospital’s temporary staging area. If the vendor’s systems were compromised, for example by a rogue AI agent, sensitive patient data could be exposed.',\n        prompt: 'How likely is a data security breach, and how severe would it be?',\n        l: 1, s: 3, residual: 'Medium',\n        mit: 'Establish data governance standards covering the collection process, testing and storage.'\n      },\n      {\n        risk: 'Innovation not useful across units / settings',\n        title: 'Wound care: long consultations, detailed notes',\n        text: 'The wound care clinic runs long consultations and relies on handwritten notes taken during the consultation to record wound measurements and descriptions accurately. The team has suggested that AI scribing, rather than AI transcription, may suit their work better. The tool may not fit their workflow, leading to user dissatisfaction.',\n        prompt: 'How likely is it that the tool will not be useful in settings like this, and how severe would that be?',\n        l: 0, s: 2, residual: 'Medium',\n        mit: 'Use evaluation of previous data to inform the new model and implement the recommended changes.'\n      }\n    ];\n    this.state = {\n      idx: 0,\n      answers: this.SC.map(() => ({ l: 0, s: 0, lt: false, st: false, rev: false }))\n    };\n  }\n\n  upd(patch) {\n    const a = this.state.answers.slice();\n    a[this.state.idx] = Object.assign({}, a[this.state.idx], patch);\n    this.setState({ answers: a });\n  }\n\n  ri(name) { return this.R.indexOf(name); }\n\n  go(n, reset) {\n    clearTimeout(this.t);\n    this.setState({ fade: true });\n    this.t = setTimeout(() => {\n      const patch = { idx: n, fade: false };\n      if (reset) patch.answers = this.SC.map(() => ({ l: 0, s: 0, lt: false, st: false, rev: false }));\n      this.setState(patch);\n    }, 260);\n  }\n\n  componentWillUnmount() { clearTimeout(this.t); }\n\n  // Needle sits inside its rating's band, nudged by a combined likelihood + severity score,\n  // so every slider change moves it a little even when the rating stays the same.\n  needle(l, s) {\n    const score = (a, b) => a / 2 + b / 3;\n    const r = this.M[l][s];\n    const vals = [];\n    for (let a = 0; a < 3; a++) for (let b = 0; b < 4; b++) if (this.M[a][b] === r) vals.push(score(a, b));\n    const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);\n    const start = -90 + 45 * r, pad = 8;\n    const t = max === min ? 0.5 : (score(l, s) - min) / (max - min);\n    return start + pad + t * (45 - 2 * pad);\n  }\n\n  opts(names, sel) {\n    return names.map((n, k) => ({ n, op: k === sel ? 1 : 0, y: k === sel ? 0 : (k < sel ? -10 : 10), d: k === sel ? 0.15 : 0 }));\n  }\n\n  renderVals() {\n    const { idx, answers } = this.state;\n    const total = this.SC.length;\n    const onSummary = idx >= total;\n    const i = Math.min(idx, total - 1);\n    const sc = this.SC[i];\n    const cur = answers[i];\n    const r = this.M[cur.l][cur.s];\n    const er = this.M[sc.l][sc.s];\n    const resI = this.ri(sc.residual);\n\n    const lOk = cur.l === sc.l, sOk = cur.s === sc.s, rOk = r === er;\n    const expertLine = 'Expert assessment: ' + this.L[sc.l] + ' likelihood, ' + this.S[sc.s] + ' severity.';\n\n    let fbTitle, fbText;\n    if (rOk && lOk && sOk) {\n      fbTitle = 'Spot on';\n      fbText = 'Your likelihood, severity and overall rating all match the expert assessment.';\n    } else if (rOk) {\n      fbTitle = 'Same rating, different route';\n      fbText = 'Your overall rating of ' + this.R[r] + ' matches, but you weighed likelihood or severity differently. ' + expertLine;\n    } else {\n      fbTitle = 'The expert rated this risk ' + this.R[er];\n      fbText = 'You rated it ' + this.R[r] + '. ' + (r < er ? 'You may be underestimating this risk. ' : 'You may be overestimating this risk. ') + expertLine;\n    }\n\n    const needRate = [];\n    if (!cur.lt) needRate.push('likelihood');\n    if (!cur.st) needRate.push('severity');\n\n    const summary = this.SC.map((s, k) => {\n      const a = answers[k];\n      const yr = this.M[a.l][a.s];\n      const xr = this.M[s.l][s.s];\n      const rated = a.lt || a.st;\n      const m = rated && yr === xr;\n      return {\n        risk: s.risk,\n        you: rated ? this.R[yr] + ' (' + this.L[a.l] + ' / ' + this.S[a.s] + ')' : 'Not rated',\n        expert: this.R[xr], bg: this.BG[xr], fg: this.FG[xr],\n        residual: s.residual,\n        result: m ? 'Match' : rated ? 'Different' : '—',\n        color: m ? '#444A40' : '#616161',\n        m\n      };\n    });\n\n    return {\n      sc, cur,\n      num: i + 1, total,\n      showNav: !onSummary, showSummary: onSummary,\n      dots: this.SC.map((_, k) => ({ bg: k === i ? '#000F46' : answers[k].rev ? '#ABC1A7' : '#D6D6D6' })),\n      lName: this.L[cur.l], sName: this.S[cur.s],\n      lOpts: this.opts(this.L, cur.l), sOpts: this.opts(this.S, cur.s), rOpts: this.opts(this.R, r),\n      mainOp: this.state.fade ? 0 : 1, mainY: this.state.fade ? 8 : 0,\n      rName: this.R[r], rBg: this.BG[r], rFg: this.FG[r],\n      needleDeg: this.needle(cur.l, cur.s),\n      notRevealed: !cur.rev,\n      revealDisabled: needRate.length > 0,\n      revealHint: needRate.length ? 'Move the ' + needRate.join(' and ') + ' slider' + (needRate.length > 1 ? 's' : '') + ' to rate this risk, then check your answer.' : 'Happy with your rating? Compare it with the expert assessment.',\n      match: rOk, noMatch: !rOk,\n      fbTitle, fbText,\n      fbBg: rOk ? '#EAEFE9' : '#BFC3D1',\n      resBg: this.BG[resI], resFg: this.FG[resI],\n      prevDisabled: idx === 0,\n      nextLabel: i === total - 1 ? 'See summary' : 'Next scenario',\n      matches: summary.filter((x) => x.m).length,\n      summary,\n      setL: (e) => this.upd({ l: Number(e.target.value), lt: true }),\n      setS: (e) => this.upd({ s: Number(e.target.value), st: true }),\n      reveal: () => this.upd({ rev: true }),\n      next: () => this.go(Math.min(this.state.idx + 1, total)),\n      prev: () => this.go(Math.max(this.state.idx - 1, 0)),\n      restart: () => this.go(0, true)\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
